<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" fill="none">
  <defs>
    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#142B4A" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#60A5FA" />
    </linearGradient>
  </defs>
  <!-- Background Shield/Badge -->
  <rect width="100" height="100" rx="24" fill="url(#logoGrad)" />
  
  <!-- Bridge Arch Structure (Setu) -->
  <path d="M18 68 C28 42, 72 42, 82 68" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" fill="none" />
  
  <!-- Supporting Pillars & Digital Rays -->
  <line x1="34" y1="53" x2="34" y2="72" stroke="#93C5FD" stroke-width="3" stroke-linecap="round" />
  <line x1="50" y1="47" x2="50" y2="72" stroke="#93C5FD" stroke-width="4" stroke-linecap="round" />
  <line x1="66" y1="53" x2="66" y2="72" stroke="#93C5FD" stroke-width="3" stroke-linecap="round" />
  
  <!-- Central AI / Connection Node -->
  <circle cx="50" cy="30" r="10" fill="url(#accentGrad)" />
  <circle cx="50" cy="30" r="4" fill="#FFFFFF" />
  
  <!-- Digital Pulse Nodes -->
  <circle cx="26" cy="36" r="4" fill="#60A5FA" opacity="0.8" />
  <circle cx="74" cy="36" r="4" fill="#60A5FA" opacity="0.8" />
  
  <!-- Connector Lines -->
  <line x1="30" y1="35" x2="40" y2="31" stroke="#93C5FD" stroke-width="2" stroke-dasharray="2 2" />
  <line x1="70" y1="35" x2="60" y2="31" stroke="#93C5FD" stroke-width="2" stroke-dasharray="2 2" />
  
  <!-- Base Ground Line -->
  <line x1="15" y1="74" x2="85" y2="74" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" opacity="0.9" />
</svg>
